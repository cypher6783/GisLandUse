[project]
name = "rice-suitability-nigeria"
version = "0.1.0"
description = "Intelligent land suitability analysis for rice cultivation in Nigeria"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "fiona>=1.9",
    "shapely>=2.0",
    "pyproj>=3.6",
    "matplotlib>=3.7",
    "folium>=0.15",
    "pandas>=2.0",
    "xarray>=2023.1",
    "scipy>=1.11",
    "click>=8.1",
    "rich>=13.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "jupyter>=1.0",
    "ipykernel>=6.25",
]

[project.scripts]
rice-suitability = "src.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
